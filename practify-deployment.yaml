apiVersion: apps/v1
kind: Deployment
metadata:
  name: practify
  namespace: practify
  labels:
    app: practify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practify
  template:
    metadata:
      labels:
        app: practify
    spec:
      # Use the secret we just created to log into Docker Hub
      imagePullSecrets:
        - name: dockerhub-key
      containers:
        - name: practify
          image: moindev/practify:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # This pulls all keys from your 'practify-secrets' (DB URL, Master Key, etc.)
          envFrom:
            - secretRef:
                name: practify-secrets
          env:
            - name: RAILS_ENV
              value: "production"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: practify-ingress
  namespace: practify
  annotations:
    # Tells Traefik to use the SSL certificate we just uploaded
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
  - hosts:
    - rpi02.taila27a53.ts.net
    secretName: practify-tls-cert
  rules:
  - host: rpi02.taila27a53.ts.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: practify-service
            port:
              number: 80
