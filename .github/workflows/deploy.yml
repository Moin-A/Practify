name: Deploy to Raspberry Pi
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build and Deploy on Pi via SSH
        run: |
          cat > /tmp/deploy_script.sh << 'SCRIPT'
          #!/bin/bash
          # -e: exit on error, -x: show commands as they run
          set -ex

          # 1. SETUP
          TARGET_DIR="$HOME/practify"
          mkdir -p "$TARGET_DIR"
          cd "$TARGET_DIR"

          # 2. SYNC REPOSITORY
          if [ ! -d ".git" ]; then
            echo "--- Cloning ---"
            git clone https://github.com/Moin-A/Practify.git .
          else
            echo "--- Syncing ---"
            git fetch origin
            git reset --hard origin/main
          fi

          # 3. DOCKER BUILD (NATIVE ARM)
          echo "--- Docker Login ---"
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "--- Building & Pushing ---"
          sudo docker build -t ${{ secrets.DOCKER_USERNAME }}/practify:latest .
          sudo docker push ${{ secrets.DOCKER_USERNAME }}/practify:latest

          # 4. FIND MANIFESTS
          DEPLOY_YAML=$(find . -name "practify-deployment.yaml" | head -n 1)
          WORKER_YAML=$(find . -name "practify-worker-deployment.yaml" | head -n 1)

          # 5. KUBERNETES APPLY
          echo "--- Applying Manifests ---"
          sudo kubectl apply -f "$DEPLOY_YAML"
          sudo kubectl apply -f "$WORKER_YAML"
          
          echo "--- Restarting Everything ---"
          sudo kubectl rollout restart deployment/practify -n practify
          sudo kubectl rollout restart deployment/practify-worker -n practify
          
          echo "--- Waiting for Status ---"
          sudo kubectl rollout status deployment/practify -n practify --timeout=60s
          
          echo "✅ DEPLOYMENT COMPLETE"
          SCRIPT
          
          # Move and Execute (These run on the GitHub Runner)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/deploy_script.sh ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}:/tmp/deploy_script.sh
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} 'bash /tmp/deploy_script.sh'
          # 4. DEPLOYMENT SANITY CHECK
          # Find both the Web and Worker manifests
          DEPLOY_YAML=$(find . -name "practify-deployment.yaml" | head -n 1)
          WORKER_YAML=$(find . -name "practify-worker-deployment.yaml" | head -n 1)

          if [ -z "$DEPLOY_YAML" ] || [ -z "$WORKER_YAML" ]; then
            echo "❌ ERROR: One or more manifests not found!"
            exit 1
          fi

          echo "🚀 Found manifests: $DEPLOY_YAML and $WORKER_YAML"

          # 5. KUBERNETES APPLY
          sudo kubectl apply -f "$DEPLOY_YAML"
          sudo kubectl apply -f "$WORKER_YAML"
          
          echo "--- Restarting Deployments ---"
          # Restart both so they pick up new images and secrets
          sudo kubectl rollout restart deployment/practify -n practify || true
          sudo kubectl rollout restart deployment/practify-worker -n practify || true
          
          echo "--- Waiting for Web to be Ready ---"
          sudo kubectl rollout status deployment/practify -n practify
          
          echo "--- Waiting for Worker to be Ready ---"
          sudo kubectl rollout status deployment/practify-worker -n practify