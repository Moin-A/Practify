name: Deploy to Raspberry Pi
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Build and Deploy on Pi via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }} # Your Tailscale 100.x.x.x IP
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # This runs DIRECTLY on your Pi
            cd ~/practify || git clone https://github.com/Moin-A/Practify.git ~/practify
            cd ~/practify
            git pull origin main
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Build ARM64 image natively on Pi
            docker build -t ${{ secrets.DOCKER_USERNAME }}/practify:latest .
            
            # Push to Docker Hub
            docker push ${{ secrets.DOCKER_USERNAME }}/practify:latest
            
            # Deploy to Kubernetes
            kubectl apply -f deployment.yaml
            kubectl rollout restart deployment/practify -n practify
            kubectl rollout status deployment/practify -n practify