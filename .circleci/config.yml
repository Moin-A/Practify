version: 2.1

jobs:
  build_and_deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14

      - run:
          name: Build and Push Docker Image (ARM64)
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker buildx create --use
            docker buildx build \
              --platform linux/arm64 \
              --provenance=false \
              -t $DOCKER_USERNAME/practify:latest \
              --push .

      - run:
          name: Install Tailscale and Connect
          command: |
            curl -fsSL https://tailscale.com/install.sh | sh
            # Use the Auth Key from Tailscale Admin Console
            sudo tailscale up --authkey=${TAILSCALE_AUTH_KEY} --hostname=circleci-job

      - run:
          name: Setup SSH and Tunnel
          command: |
            mkdir -p ~/.ssh
            # Using your id_ed25519 key
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H $PI_HOST >> ~/.ssh/known_hosts
            # Create tunnel to K3s API over Tailscale
            ssh -f -N -L 6443:localhost:6443 $PI_USER@$PI_HOST -i ~/.ssh/id_ed25519
      
      - run:
          name: Configure Kubectl and Deploy
          command: |
            mkdir -p ~/.kube
            echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
            sed -i 's|server: https://.*:6443|server: https://localhost:6443|g' ~/.kube/config
            
            # Install kubectl binary
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/

            # Deploy
            kubectl apply -f deployment.yaml
            kubectl rollout restart deployment/practify -n practify
            kubectl rollout status deployment/practify -n practify --timeout=5m

workflows:
  deploy_workflow:
    jobs:
      - build_and_deploy:
          filters:
            branches:
              only: main