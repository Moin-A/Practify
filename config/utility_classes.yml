# Utility Classes Configuration for Classy::Yaml
# Use yass helper in components to reference these classes
# Example: <%= yass(btn: :primary) %>

btn:
  base: "px-4 py-2 rounded-lg font-medium transition-colors duration-200"
  primary: "bg-brand text-white hover:bg-brand-hover"
  secondary: "bg-gray-200 text-gray-800 hover:bg-gray-300"
  outline: "border-2 border-brand text-brand hover:bg-brand hover:text-white"
  danger: "bg-red-500 text-white hover:bg-red-600"
  ghost: "text-gray-700 hover:bg-gray-100"

container:
  base: "container mx-auto px-4"
  narrow: "container mx-auto px-4 max-w-2xl"
  wide: "container mx-auto px-4 max-w-7xl"

card:
  base: "bg-white rounded-lg border border-cursor-border shadow-sm p-6"
  elevated: "bg-white rounded-lg border border-cursor-border shadow-md p-6"

input:
  base: "w-full px-4 py-2 border border-input-border rounded-lg bg-input-bg focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent"
  error: "w-full px-4 py-2 border border-red-500 rounded-lg bg-input-bg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent"

text:
  heading: "text-3xl font-bold mb-4"
  subheading: "text-xl text-gray-600 mb-4"
  body: "text-base text-gray-700"
  muted: "text-sm text-cursor-text-muted"

spacing:
  section: "py-8"
  section_small: "py-4"
  section_large: "py-12"
svg:
  calender: "w-5 h-5"
  clients: "w-5 h-5"
  billing: "w-5 h-5"
  settings: "w-5 h-5"
